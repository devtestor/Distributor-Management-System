services:
  postgres:
    image: postgres:16-alpine
    container_name: human-concept-erp-postgres
    environment:
      POSTGRES_DB: human_concept_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d human_concept_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
