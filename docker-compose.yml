services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: human-concept-erp-app
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: /api
      API_INTERNAL_URL: http://api:4000
    ports:
      - "3000:3000"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: human-concept-erp-api
    command: npm run api:start
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/human_concept_erp?schema=public
      API_PORT: 4000
      JWT_SECRET: replace-this-with-a-long-random-secret
      JWT_EXPIRES_IN: 1h
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: human-concept-erp-postgres
    environment:
      POSTGRES_DB: human_concept_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d human_concept_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
