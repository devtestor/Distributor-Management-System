services:
  - type: web
    name: distributor-management-system-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run render:api:build
    startCommand: npm run render:api:start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: WEB_ORIGIN
        fromService:
          type: web
          name: distributor-management-system-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: distributor-management-system-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run render:web:build
    startCommand: npm run render:web:start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: distributor-management-system-api
          envVarKey: RENDER_EXTERNAL_URL
